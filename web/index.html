<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070c" />
    <meta name="description" content="Extractor de certificados por DNI - JOMISER + EIN" />
    <title>NEXA // Extractor de Certificados</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="grid-bg" aria-hidden="true"></div>

    <main class="wrap">
      <!-- ================= HEADER ================= -->
      <header class="head">
        <div class="head-l">
          <span class="dot"></span>
          <h1 class="glitch" data-text="EXTRACTOR DE CERTIFICADOS">EXTRACTOR DE CERTIFICADOS</h1>
        </div>
        <div class="head-r">
          <span class="tag">JOMISER</span>
          <span class="tag">EIN · WebNexa</span>
          <span class="head-ver">v1.0</span>
        </div>
      </header>

      <!-- ================= COLUMNA IZQUIERDA: ENTRADA ================= -->
      <div class="col col-in">
        <section class="panel panel-obj" aria-labelledby="t-target">
          <div class="panel-head">
            <h2 id="t-target">01 · OBJETIVOS</h2>
            <span class="count" id="dni-count">0 DNI</span>
          </div>

          <div class="panel-body panel-body-col">
            <label class="lbl" for="dnis">Documentos — uno por línea</label>
            <textarea
              id="dnis"
              class="ta"
              spellcheck="false"
              autocomplete="off"
              placeholder="71481337&#10;07481337&#10;43644102"
            ></textarea>

            <div class="row-btns">
              <label class="btn btn-ghost" for="archivo">
                <svg viewBox="0 0 24 24" class="ic"><path d="M12 16V4m0 0L8 8m4-4 4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                EXCEL / CSV
              </label>
              <input id="archivo" type="file" accept=".xlsx,.xlsm,.csv,.txt" hidden />
              <button class="btn btn-ghost" id="btn-limpiar" type="button">LIMPIAR</button>
            </div>

            <div class="avisos">
              <div id="aviso-ceros" class="alert alert-warn" hidden></div>
              <div id="aviso-archivo" class="alert alert-info" hidden></div>
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="t-cfg">
          <div class="panel-head">
            <h2 id="t-cfg">02 · FUENTES</h2>
            <button class="lnk" id="btn-cred" type="button">credenciales</button>
          </div>

          <div class="panel-body">
            <div class="switches">
              <label class="sw">
                <input type="checkbox" id="src-jomiser" checked />
                <span class="sw-box"></span>
                <span class="sw-txt"><b>JOMISER</b><em>aula.jomiser.com</em></span>
              </label>
              <label class="sw">
                <input type="checkbox" id="src-ein" checked />
                <span class="sw-box"></span>
                <span class="sw-txt"><b>EIN</b><em>WebNexa · Cert. x Persona</em></span>
              </label>
            </div>

            <div class="cred" id="cred" hidden>
              <div class="cred-f">
                <label class="lbl" for="usuario">Usuario EIN</label>
                <input id="usuario" class="inp" type="text" autocomplete="off" spellcheck="false" />
              </div>
              <div class="cred-f">
                <label class="lbl" for="password">Contraseña</label>
                <input id="password" class="inp" type="password" autocomplete="off" />
              </div>
              <p class="hint">
                Vacío = credenciales del servidor (<code>EIN_USUARIO</code> /
                <code>EIN_PASSWORD</code>).
              </p>
            </div>
          </div>
        </section>

        <section class="panel panel-go">
          <div class="panel-body">
            <div class="dest" id="dest-row">
              <span class="lbl dest-lbl">Carpeta de guardado</span>
              <div class="dest-box">
                <svg viewBox="0 0 24 24" class="ic dest-ic"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="dest-txt" id="dest-txt">sin elegir — se pedirá al iniciar</span>
                <button class="btn btn-mini" id="btn-dest" type="button">ELEGIR</button>
              </div>
            </div>

            <button class="btn btn-go" id="btn-run" type="button">
              <span class="go-txt">INICIAR EXTRACCIÓN</span>
              <span class="go-arrow">▸</span>
            </button>
            <button class="btn btn-stop" id="btn-stop" type="button" hidden>ABORTAR</button>

            <div class="bar-wrap" id="bar-wrap" hidden>
              <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
              <div class="bar-meta">
                <span id="bar-txt">en espera</span>
                <span id="bar-pct">0%</span>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- ================= COLUMNA DERECHA: SALIDA ================= -->
      <div class="col col-out">
        <section class="panel panel-res" id="panel-res" hidden aria-labelledby="t-res">
          <div class="panel-head">
            <h2 id="t-res">03 · RESULTADOS</h2>
            <span class="count" id="res-count"></span>
          </div>
          <div class="panel-body panel-body-scroll">
            <div id="resultados" class="res"></div>
          </div>
          <div class="panel-foot" id="acciones-guardar" hidden>
            <button class="btn btn-go btn-sm" id="btn-zip" type="button">DESCARGAR ZIP</button>
            <button class="btn btn-ghost btn-sm" id="btn-carpeta" type="button" hidden>
              GUARDAR EN CARPETA
            </button>
          </div>
        </section>

        <section class="panel panel-term" aria-labelledby="t-log">
          <div class="panel-head">
            <h2 id="t-log">04 · CONSOLA</h2>
            <button class="lnk" id="btn-log-clear" type="button">limpiar</button>
          </div>
          <div class="panel-body panel-body-flush">
            <div class="term" id="term" role="log" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </main>

    <!-- notificacion de fin de descarga -->
    <div class="toast" id="toast" hidden role="status" aria-live="assertive">
      <div class="toast-bar"></div>
      <div class="toast-in">
        <span class="toast-ic" id="toast-ic">✓</span>
        <div class="toast-tx">
          <b id="toast-tit">Descarga completa</b>
          <span id="toast-sub"></span>
        </div>
        <button class="toast-x" id="toast-x" type="button" aria-label="Cerrar">×</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
